<!-- Description: Login page for the user to login to the system -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="assets/js/login-basic.js"></script>
    <link rel="shortcut icon" href="favicon.png" type="image/x-icon" />
    <main-css></main-css>
    <style>
        .login-page {
            min-height: calc(100vh - 140px);
            padding: 60px 0;
            background-color: #f5f5f5;
        }

        .login-container {
            display: flex;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            margin: 0 auto;
            max-width: 1200px;
        }

        .image-section {
            flex: 1;
            background-image: url('assets/images/login.jpg');
            background-size: cover;
            background-position: center;
            min-height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
        }    

        .login-section {
            flex: 1;
            padding: 40px;
        }

        .login-form {
            max-width: 400px;
            margin: 0 auto;
        }

        .input-group {
            margin-bottom: 1.5rem;
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e1e1;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .input-group:focus {
            border-color: #4A90E2;
            outline: none;
            box-shadow: 0 0 0 4px rgba(74, 144, 226, 0.1);
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            font-size: 1.1rem;
            margin-top: 20px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .login-container {
                flex-direction: column;
                margin: 20px;
            }
            
            .image-section {
                min-height: 300px;
            }

            .login-section {
                padding: 30px 20px;
            }
        }
    </style>
</head>

<body>
    <main-header></main-header>
    
    <div class="login-page">
        <div class="login-container">
            <div class="image-section"></div>
            <div class="login-section">
                <div class="login-form">
                    <h4 class="fs-1 text-center mb-4" style="font-size: xx-large;">Login</h4>
                    <form id="login-form">
                        <input type="email" placeholder="Email Address" name="email" id="email" class="input-group">
                        <input type="password" placeholder="Enter Password" name="password" id="pass" class="input-group">
                        <button type="submit" class="btn btn-primary" id="submit">Login</button>
                        <div class="message"></div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <main-footer></main-footer>
    
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="assets/js/login.js"></script>
</body>
</html>
